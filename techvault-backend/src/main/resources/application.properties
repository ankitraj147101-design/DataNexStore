# DataNex Store Backend — Application Properties

spring.application.name=datanexstore-backend
server.port=8080
server.servlet.context-path=/api

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/datanexstore}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000

# JWT
app.jwt.secret=${JWT_SECRET:ZGF0YW5leHN0b3JlLXN1cGVyLXNlY3JldC1qd3Qta2V5LWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmctZm9yLWhzMjU2LTIwMjY=}
app.jwt.access-token-expiration=${JWT_ACCESS_EXPIRY:900000}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRY:604800000}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:datanex-cloud}
cloudinary.api-key=${CLOUDINARY_API_KEY:your-api-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your-api-secret}

# Razorpay
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_your_key_id}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:your_razorpay_secret}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:your_webhook_secret}

# WhatsApp (Twilio)
twilio.account-sid=${TWILIO_ACCOUNT_SID:your_twilio_account_sid}
twilio.auth-token=${TWILIO_AUTH_TOKEN:your_twilio_auth_token}
twilio.whatsapp-number=${TWILIO_WHATSAPP_NUMBER:whatsapp:+14155238886}
app.whatsapp.business-number=+919911371218
app.whatsapp.order-booking-enabled=true

# Mail (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:noreply@datanexstore.in}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@datanexstore.in}
app.mail.from-name=DataNexStore

# App Config
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.com.techvault=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
